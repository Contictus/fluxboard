# Prometheus scrape config (docs/10-INFRA-DEVOPS.md §5). Targets are compose
# service DNS names on the shared network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: worker
    static_configs:
      - targets: ["worker:8081"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
