# Enforces the dependency rule from docs/03-ARCHITECTURE.md §3:
#   domain <- usecase <- interface,  domain <- infrastructure
#   usecase MUST NOT import infrastructure; wiring happens only in cmd/*.
#
# Run in CI (Linux): go-arch-lint check   (from the backend/ module root).
# NOTE: go-arch-lint v1.15.0 has a Windows path bug (it emits back-slashed
# paths but matches forward-slash globs), so local `make lint` on Windows
# under-attaches nested packages. The authoritative check runs on ubuntu in CI,
# where these forward-slash globs resolve correctly.
version: 3

# External libraries are allowed anywhere; this lint governs INTERNAL component
# boundaries only. Leaf components (domain, pkg, config) are absent from deps,
# so they may depend on no internal component — that encodes domain's
# stdlib-only rule and keeps pkg/config true leaves.
allow:
  depOnAnyVendor: true
  # Import edges are the enforced rule (docs/03 §3). deepScan's call/DI-edge
  # analysis false-positives on the mandated pattern (cmd wiring injects repos
  # into constructors), so it stays off.
  deepScan: false

components:
  domain:         { in: internal/domain/** }
  usecase:        { in: internal/usecase/** }
  infrastructure: { in: internal/infrastructure/** }
  interface:      { in: internal/interface/** }
  pkg:            { in: internal/pkg/** }
  config:         { in: internal/config }
  # cmd/* is the only place wiring may import across every layer (DI container).
  cmd:            { in: cmd/** }
  # sqlc output: imported by every repository, so it is shared, not layered.
  gen:            { in: internal/infrastructure/postgres/gen }

# Shared code any component may import (sqlc query layer). Test files are
# excluded from analysis: harnesses legitimately wire across layers.
commonComponents:
  - gen
excludeFiles:
  - _test\.go$

deps:
  # Intra-component imports (subpackage to subpackage) are allowed: a layer is
  # one component, not one package.
  domain:
    mayDependOn: [domain]
  usecase:
    mayDependOn: [domain, pkg]
  infrastructure:
    mayDependOn: [domain, pkg, config]
  interface:
    mayDependOn: [domain, usecase, pkg, config, interface]
  cmd:
    mayDependOn: [domain, usecase, infrastructure, interface, pkg, config]
