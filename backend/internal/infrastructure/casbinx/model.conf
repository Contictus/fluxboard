# Casbin model for the org-role → (object, action) gate (docs/05-TENANCY-RBAC.md
# §3, as adapted by ADR-014). sub = role token (role:OWNER…); obj = symbolic
# resource class; act = read|write. Role inheritance (g) expresses the
# OWNER>ADMIN>MEMBER>GUEST hierarchy so permissions accumulate upward and each
# permission is stated once at the lowest role that holds it.
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
