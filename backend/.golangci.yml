# golangci-lint config (v2 format). Conservative, high-signal set for a young codebase;
# tightened as the project grows.
version: "2"
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx

issues:
  exclude-rules:
    # Doc-only stub packages carry no logic to lint.
    - path: doc\.go
      linters: [unused]
