# golangci-lint config (v2 format, produced by `golangci-lint migrate`).
# Conservative, high-signal set for a young codebase; tightened as the project
# grows. errcheck/govet/ineffassign/staticcheck/unused are v2 defaults.
version: "2"
linters:
  enable:
    - bodyclose
    - misspell
    - noctx
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Doc-only stub packages carry no logic to lint.
      - linters:
          - unused
        path: doc\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
