version: "2"
sql:
  - engine: "postgresql"
    # Queries are the source of truth (docs/CLAUDE.md §Code Conventions).
    # None exist in Phase 0 — `make sqlc` is a no-op that proves the toolchain.
    queries: "internal/infrastructure/postgres/queries"
    # Schema derived from the golang-migrate up files.
    schema: "migrations"
    gen:
      go:
        package: "gen"
        sql_package: "pgx/v5"
        out: "internal/infrastructure/postgres/gen"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "citext"
            go_type: "string"
