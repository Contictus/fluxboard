# air hot-reload config for local dev (used by docker-compose.override.yml).
# Rebuilds and restarts cmd/api on source change.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "internal/infrastructure/postgres/gen"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
